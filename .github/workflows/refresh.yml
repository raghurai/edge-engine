name: Refresh dashboard data

# Keeps the published dashboard alive without a laptop: runs the export every
# 15 minutes during US market hours, once after the close (when earnings-drift
# entries confirm and the engine portfolio trades), and once before the open.
# Commits docs/data.json and docs/engine_portfolio.json so Pages republishes.
# Needs repository secrets ALPACA_API_KEY and ALPACA_SECRET_KEY (paper keys).

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"    # every 5 min, 13:00-20:59 UTC = 9:00-16:59 ET (EDT)
    - cron: "15 21 * * 1-5"        # after the close, 17:15 ET
    - cron: "0 12 * * 1-5"         # before the open, 08:00 ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - name: Restore data caches
        uses: actions/cache/restore@v4
        with:
          path: |
            data/wide
            data/fund
            data/nasdaq_cal
          key: engine-data-${{ github.run_id }}
          restore-keys: engine-data-
      - name: Export
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/export.py
      - name: Save data caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/wide
            data/fund
            data/nasdaq_cal
          key: engine-data-${{ github.run_id }}
      - name: Commit snapshot
        # Snapshots are squashed into the last commit so 80 refreshes a day don't bloat history.
        run: |
          git config user.name "raidical-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/engine_portfolio.json
          if git diff --cached --quiet; then exit 0; fi
          if git log -1 --format=%s | grep -q '^Refresh dashboard data'; then
            git commit --amend -m "Refresh dashboard data $(date -u +%Y-%m-%dT%H:%M)"
            git push --force-with-lease origin HEAD:main || { git fetch origin && git rebase origin/main && git push origin HEAD:main; }
          else
            git commit -m "Refresh dashboard data $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash origin main && git push
          fi
